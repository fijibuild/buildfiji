[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/fijibuild/buildfiji"

[workspace.dependencies]
# Internal crates
fjfj-archive = { path = "crates/fjfj-archive" }
fjfj-bazel-compat = { path = "crates/fjfj-bazel-compat" }
fjfj-analysis = { path = "crates/fjfj-analysis" }
fjfj-bzlmod = { path = "crates/fjfj-bzlmod" }
fjfj-cli = { path = "crates/fjfj-cli" }
fjfj-engine = { path = "crates/fjfj-engine" }
fjfj-exec = { path = "crates/fjfj-exec" }
fjfj-graph = { path = "crates/fjfj-graph" }
fjfj-loading = { path = "crates/fjfj-loading" }
fjfj-models = { path = "crates/fjfj-models" }
fjfj-proto = { path = "crates/fjfj-proto" }
fjfj-query = { path = "crates/fjfj-query" }
fjfj-remote = { path = "crates/fjfj-remote" }
fjfj-repo = { path = "crates/fjfj-repo" }
fjfj-sandbox = { path = "crates/fjfj-sandbox" }
fjfj-starlark = { path = "crates/fjfj-starlark" }
fjfj-telemetry = { path = "crates/fjfj-telemetry" }

# Reused ecosystem libraries (see docs/ARCHITECTURE.md "Reuse over rebuild")
allocative = "0.3"
ar = "0.9"
anyhow = "1"
ariadne = "0.6"
base64 = "0.23"
bzip2 = "0.5"
bazel-remote-apis = "0.28"
chumsky = "0.13"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
libc = "0.2"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "experimental_metrics_custom_reader"] }
prost = "0.14"
protobuf-src = "2"
regal = { git = "https://github.com/NathanHowell/regal" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
stacker = "0.1"
starlark = { path = "crates/starlark" }
num-bigint = "0.4"
starlark_derive = "0.14"
starlark_syntax = { path = "crates/starlark_syntax" }
stateright = "0.31"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = "0.3"
