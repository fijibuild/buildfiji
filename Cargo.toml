[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/fijibuild/buildfiji"

[workspace.dependencies]
# Internal crates
fjfj-cli = { path = "crates/fjfj-cli" }
fjfj-starlark = { path = "crates/fjfj-starlark" }
fjfj-graph = { path = "crates/fjfj-graph" }
fjfj-exec = { path = "crates/fjfj-exec" }
fjfj-remote = { path = "crates/fjfj-remote" }
fjfj-sandbox = { path = "crates/fjfj-sandbox" }
fjfj-telemetry = { path = "crates/fjfj-telemetry" }
fjfj-bazel-compat = { path = "crates/fjfj-bazel-compat" }
fjfj-models = { path = "crates/fjfj-models" }
fjfj-spike-persist = { path = "crates/fjfj-spike-persist" }

# Reused ecosystem libraries (see docs/ARCHITECTURE.md "Reuse over rebuild")
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
starlark = "0.14"
starlark_syntax = "0.14"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stateright = "0.31"
bazel-remote-apis = "0.28"
prost = "0.14"
zstd = "0.13"
rkyv = "0.8"
redb = "4"
fjall = "3"
