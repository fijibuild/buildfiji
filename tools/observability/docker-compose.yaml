# buildfiji-k62.14: one-command local OTel backend for `fjfj`'s telemetry
# (see crates/fjfj-telemetry). Fans OTLP in on one endpoint, out to
# VictoriaTraces for traces and VictoriaMetrics for metrics — both take a
# direct OTLP push, no Prometheus-style scraping. See README.md to run it
# (Apple `container`/`container-compose` users especially — service
# hostnames need a one-time `sudo container system dns create` first).
name: observability
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # fjfj points OTEL_EXPORTER_OTLP_ENDPOINT here (gRPC) — the only
      # protocol fjfj-telemetry speaks, for both traces and metrics.
      - "4317:4317"
      - "4318:4318" # OTLP/HTTP, for anything that can't do gRPC.
    depends_on:
      - victoriatraces
      - victoriametrics

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.10.0
    command:
      - "-storageDataPath=/vtraces"
      # otel-collector's own OTLP/gRPC exporter reaches this directly;
      # not published to the host. TLS is on by default for this
      # listener — off here since otel-collector connects `insecure`
      # over the compose network, and this is a local dev stack only.
      - "-otlpGRPCListenAddr=:4317"
      - "-otlpGRPC.tls=false"
    ports:
      - "10428:10428" # VMUI (/select/vmui) and Jaeger query API (/select/jaeger)

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    command:
      - "-storageDataPath=/vmetrics"
    ports:
      - "8428:8428" # VMUI, PromQL-compatible query API, and OTLP/HTTP ingest
